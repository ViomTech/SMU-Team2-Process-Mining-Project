<!-- TripleThreat mark: three interlocking triangles (TT) -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 64 64" aria-labelledby="title desc" role="img">
  <title>TripleThreat</title>
  <desc>Three interlocking triangles forming a sharp, fast “TT” mark</desc>
  <defs>
    <linearGradient id="ttg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="10" fill="#ffffff"/>
  <!-- Left triangle -->
  <path d="M6 44 L22 12 L26 20 L14 44 Z" fill="url(#ttg)"/>
  <!-- Middle triangle -->
  <path d="M22 44 L38 12 L42 20 L30 44 Z" fill="url(#ttg)"/>
  <!-- Right triangle -->
  <path d="M38 44 L54 12 L58 20 L46 44 Z" fill="url(#ttg)"/>
  <!-- Subtle base underline -->
  <rect x="10" y="48" width="44" height="3" rx="1.5" fill="#111827" opacity="0.15"/>
</svg>
